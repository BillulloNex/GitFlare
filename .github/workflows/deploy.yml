name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  # Manual redeploy from the Actions tab (e.g. after changing a Worker secret).
  workflow_dispatch:

# Never run two deploys (and therefore two migration runs) at once.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy GitFlare Worker
    env:
      # Token needs: Workers Scripts edit, D1 edit. R2 edit is optional (extra backup copy).
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE: gitflare-db
      BACKUP_BUCKET: gitflare-storage
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Verify required secrets are set
        # The Worker can't decrypt stored secrets without these. Fail before
        # touching the database rather than shipping a Worker that can't run.
        run: |
          set -euo pipefail
          names=$(npx wrangler secret list --format json | jq -r '.[].name')
          missing=0
          for s in ENCRYPTION_KEY SESSION_SECRET; do
            if ! grep -qx "$s" <<<"$names"; then
              echo "::error::Worker secret $s is not set (wrangler secret put $s)"
              missing=1
            fi
          done
          exit $missing

      - name: Guard against untracked production schema
        # Production predates Wrangler migration tracking. If the schema exists
        # but d1_migrations doesn't, `migrations apply` would replay 0001+.
        # scripts/2c-seed-migrations.sql must be run once first.
        run: |
          set -euo pipefail
          out=$(npx wrangler d1 execute "$D1_DATABASE" --remote --json --command \
            "SELECT (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='repositories') AS has_schema,
                    (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='d1_migrations') AS tracked")
          has_schema=$(jq -r '.[0].results[0].has_schema' <<<"$out")
          tracked=$(jq -r '.[0].results[0].tracked' <<<"$out")
          if [ "$has_schema" = "1" ] && [ "$tracked" = "0" ]; then
            echo "::error::d1_migrations is missing on an existing database. Run scripts/2c-seed-migrations.sql first."
            exit 1
          fi

      - name: Check for pending migrations
        id: pending
        run: |
          set -euo pipefail
          out=$(npx wrangler d1 migrations list "$D1_DATABASE" --remote 2>&1)
          echo "$out"
          if grep -q "No migrations to apply" <<<"$out"; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
          else
            echo "pending=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Record D1 restore point
        # Rollback safety via D1 Time Travel (point-in-time restore, 30 days).
        # Needs only D1 permission. To undo a bad migration:
        #   npx wrangler d1 time-travel restore gitflare-db --bookmark=<bookmark>
        if: steps.pending.outputs.pending == 'true'
        run: |
          set -euo pipefail
          bookmark=$(npx wrangler d1 time-travel info "$D1_DATABASE" --json | jq -r '.bookmark')
          test -n "$bookmark" && test "$bookmark" != "null"
          echo "Restore point before migrations: $bookmark"
          printf '### D1 restore point\n\n`npx wrangler d1 time-travel restore %s --bookmark=%s`\n' "$D1_DATABASE" "$bookmark" >> "$GITHUB_STEP_SUMMARY"

      - name: Back up D1 to R2 (best effort)
        # Extra copy. Stored in R2 (not as a workflow artifact) because the dump
        # contains sessions, key hashes and encrypted tokens. Needs R2 edit on
        # the API token; failure only warns, the Time Travel bookmark above is
        # the guaranteed restore point.
        if: steps.pending.outputs.pending == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          file="d1-backup-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA::12}.sql"
          npx wrangler d1 export "$D1_DATABASE" --remote --output="$file"
          if ! npx wrangler r2 object put "$BACKUP_BUCKET/d1-backups/$file" --file="$file" --content-type=application/sql --remote; then
            rm -f "$file"
            echo "::warning::R2 backup skipped: API token lacks R2 edit. Time Travel bookmark is the restore point."
            exit 1
          fi
          rm -f "$file"
          echo "Backup: r2://$BACKUP_BUCKET/d1-backups/$file"

      - name: Apply D1 migrations
        # Runs before the deploy: migrations must stay compatible with the
        # Worker version that is currently live.
        if: steps.pending.outputs.pending == 'true'
        run: npx wrangler d1 migrations apply "$D1_DATABASE" --remote

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy

      - name: Smoke test
        # The custom domain can take a few seconds to pick up the new version.
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 "https://git.beenex.company/health"; then echo; exit 0; fi
            sleep 10
          done
          echo "::error::https://git.beenex.company/health did not return 200 after deploy"
          exit 1

  # Reference CI job image (node + git-lfs) for `checkout.lfs`. Published to
  # GHCR only when its Dockerfile changes; the runner uses it via CI_IMAGE.
  ci-image:
    runs-on: ubuntu-latest
    name: Publish CI job image (GHCR)
    needs: deploy
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Did the CI image change?
        id: changed
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --quiet "$before" HEAD -- packages/runner/ci-image; then
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "CI image unchanged; skipping."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.changed.outputs.build == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        if: steps.changed.outputs.build == 'true'
        run: |
          set -euo pipefail
          image="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/gitflare-ci:node22"
          docker build -t "$image" packages/runner/ci-image
          docker push "$image"
          echo "Published $image" >> "$GITHUB_STEP_SUMMARY"

  # The runner (packages/runner) is hosted on Coolify. It speaks a versioned
  # protocol with the Worker, so it ships from the same workflow, right after
  # the Worker. Skipped when nothing runner-related changed, so in-flight CI
  # jobs aren't killed by a needless restart.
  runner:
    runs-on: ubuntu-latest
    name: Deploy CI runner (Coolify)
    needs: deploy
    env:
      COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      RUNNER_APP_UUID: o3qsphlnof4yg43wj7i4zawe
      RUNNER_HEALTH_URL: https://runner.beenex.org/health
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Did the runner change?
        id: changed
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --quiet "$before" HEAD -- packages/runner src/lib/runner-protocol.ts; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Runner unchanged; skipping."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy runner on Coolify
        if: steps.changed.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $COOLIFY_API_TOKEN")
          dep=$(curl -fsS "${auth[@]}" -X POST "$COOLIFY_BASE_URL/api/v1/deploy?uuid=$RUNNER_APP_UUID" \
            | jq -r '.deployments[0].deployment_uuid')
          echo "Coolify deployment: $dep"
          for i in $(seq 1 60); do
            status=$(curl -fsS "${auth[@]}" "$COOLIFY_BASE_URL/api/v1/deployments/$dep" | jq -r '.status')
            echo "status: $status"
            case "$status" in
              finished) break ;;
              failed|cancelled*) echo "::error::Runner deployment $status"; exit 1 ;;
            esac
            sleep 10
          done
          [ "$status" = finished ] || { echo "::error::Runner deployment timed out"; exit 1; }

      - name: Runner health check
        if: steps.changed.outputs.deploy == 'true'
        # Must match the Worker's protocol and be able to start job containers.
        run: |
          set -euo pipefail
          want=$(grep -oE 'RUNNER_PROTOCOL_VERSION = [0-9]+' src/lib/runner-protocol.ts | grep -oE '[0-9]+$')
          for i in $(seq 1 12); do
            if h=$(curl -fsS --max-time 10 "$RUNNER_HEALTH_URL"); then
              echo "$h"
              if [ "$(jq -r .protocolVersion <<<"$h")" = "$want" ] && [ "$(jq -r .docker <<<"$h")" = true ]; then exit 0; fi
            fi
            sleep 10
          done
          echo "::error::Runner is not healthy (want protocol v$want with Docker available)"
          exit 1
